plugins {
    id 'com.android.application'
}

// Redirect build artifacts outside OneDrive to eliminate Windows file locking errors
layout.buildDirectory.set(file("${System.getProperty('user.home')}/.android_builds/SafePathAI/app"))

android {
    namespace 'com.safepath.ai'
    compileSdk 34

    // Centralized server configuration from gradle.properties or command line (-P)
    def devServerIp = project.findProperty("LAPTOP_IPV4_ADDRESS") ?: "127.0.0.1"
    def devServerPort = project.findProperty("SERVER_PORT") ?: "8000"
    def prodApiUrl = project.findProperty("PROD_API_BASE_URL") ?: "https://api.safepath.ai/api/v1/"

    defaultConfig {
        applicationId "com.safepath.ai"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SERVER_HOST", "\"${devServerIp}\""
        buildConfigField "String", "SERVER_PORT", "\"${devServerPort}\""
        buildConfigField "String", "API_BASE_URL", "\"http://${devServerIp}:${devServerPort}/api/v1/\""
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            buildConfigField "String", "API_BASE_URL", "\"http://${devServerIp}:${devServerPort}/api/v1/\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Production strictly enforces secure HTTPS
            buildConfigField "String", "API_BASE_URL", "\"${prodApiUrl}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }
}

// Disable checkClasspath tasks to bypass AGP 8.2 NotSerializableException: com.android.build.gradle.internal.tasks.Info bug
tasks.matching { it.name.startsWith("check") && it.name.endsWith("Classpath") }.configureEach {
    enabled = false
    onlyIf { false }
}

dependencies {
    // ─── Core AndroidX ───────────────────────────────────────────────
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'

    // ─── Material Design ─────────────────────────────────────────────
    implementation 'com.google.android.material:material:1.11.0'

    // ─── Layouts ─────────────────────────────────────────────────────
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ─── Navigation Component ────────────────────────────────────────
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // ─── MVVM: ViewModel + LiveData ──────────────────────────────────
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'

    // ─── Room Database ───────────────────────────────────────────────
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ─── Networking ──────────────────────────────────────────────────
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ─── Location & Maps ────────────────────────────────────────────
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'org.maplibre.gl:android-sdk:11.0.1'

    // ─── Security ────────────────────────────────────────────────────
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // ─── Shared Prefs ────────────────────────────────────────────────
    implementation 'androidx.preference:preference:1.2.1'

    // ─── WorkManager (background tasks) ──────────────────────────────
    implementation 'androidx.work:work-runtime:2.9.0'

    // ─── Testing ─────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

