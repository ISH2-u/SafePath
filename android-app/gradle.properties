org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.dependency.useConstraints=false
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false

# ── SafePath AI — Centralized Development Server Configuration ──────────────────
# Default: 127.0.0.1 (for physical device USB debugging via `adb reverse tcp:8000 tcp:8000`)
# For Android Emulator: 10.0.2.2
# For Wi-Fi / Hotspot LAN: Set to your computer's local IP address
# ────────────────────────────────────────────────────────────────────────────────
LAPTOP_IPV4_ADDRESS=127.0.0.1
SERVER_PORT=8000

# ── SafePath AI — Oracle Cloud / Production API Base URL ───────────────────────
# Injected into release builds (`./gradlew assembleRelease`)
# Example: https://safepath.example.com/api/v1/ or http://<OCI_IP>/api/v1/
PROD_API_BASE_URL=https://api.safepath.ai/api/v1/
