version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: safepath_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safepath_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safepath_pass}
      POSTGRES_DB: ${POSTGRES_DB:-safepath_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safepath_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safepath_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-safepath_user}:${POSTGRES_PASSWORD:-safepath_pass}@db:5432/${POSTGRES_DB:-safepath_db}
    volumes:
      - ./backend:/app

volumes:
  postgres_data:

